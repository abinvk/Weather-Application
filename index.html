<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <!--Header-->
        <header class="header">
            <h1>☁️ SkyCast</h1>
            <button id="themBtn">🌙</button>
        </header>

        <!--Search Section-->

        <section class="search-section">
            <input type="text"
                    id="cityInput"
                    placeholder="Search city...">

                    <button id="searchBtn">
                        🔍 Search
                    </button>
        </section>

        <!--Current Weather-->
        <main class="weater-card">
            <div class="location">
                <span>📍</span>
                <h2 id="cityName">Kochi, Kerala</h2>
            </div>

            <div class="weather-main">
                <div class="weather-icon">
                    ☀️
                </div>

                <div>
                    <h3 id="temperature">29°C</h3>
                    <p id="condition">Party Cloudy</p>
                    <p id="feelsLike">Feels like 31°C</p>
                </div>
                
            </div>
        </main>
    </div>


    <script src="script.js"></script>

</body>
</html>
